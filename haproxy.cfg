# HAProxy Configuration for Student Result Management System
# Enterprise-grade load balancer with health checks and failover

# Global settings
global
    log stdout format raw local0
    daemon
    maxconn 4096
    user root
    group root
    # SSL configuration (if needed)
    # tune.ssl.default-dh-param 2048

# Default settings
defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    option http-server-close
    option forwardfor except 127.0.0.0/8
    retries 3

# Statistics page for monitoring
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin123
    stats show-legends
    stats show-node

# Frontend for HTTP traffic
frontend student_frontend
    bind *:80
    mode http
    default_backend student_backend
    # Logging
    option httplog
    # Security headers
    http-response set-header X-Frame-Options "SAMEORIGIN"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header X-XSS-Protection "1; mode=block"

# Backend with round-robin load balancing and health checks
backend student_backend
    mode http
    balance roundrobin
    # Health check configuration
    option httpchk GET /actuator/health
    http-check expect status 200
    # Server configuration with health checks and failover
    server student-app-1 host.docker.internal:8081 check inter 2000 rise 2 fall 3 maxconn 100
    server student-app-2 host.docker.internal:8082 check inter 2000 rise 2 fall 3 maxconn 100
    server student-app-3 host.docker.internal:8083 check inter 2000 rise 2 fall 3 maxconn 100
    # Logging
    option httplog
    # Connection settings
    option http-server-close
    option forwardfor except 127.0.0.0/8

# Frontend for Prometheus metrics
frontend prometheus_frontend
    bind *:9090
    mode http
    default_backend prometheus_backend

# Backend for Prometheus
backend prometheus_backend
    mode http
    server prometheus prometheus:9090 check

# Frontend for Grafana
frontend grafana_frontend
    bind *:3000
    mode http
    default_backend grafana_backend

# Backend for Grafana
backend grafana_backend
    mode http
    server grafana grafana:3000 check
