services:
  nginx:
    image: nginx:latest
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-logs:/var/log/nginx
    networks:
      - student-result-network
    depends_on:
      - student-app-1
      - student-app-2
      - student-app-3
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  student-app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-app-1
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/student_results
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Shankii9900#
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - student-result-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  student-app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-app-2
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/student_results
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Shankii9900#
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - student-result-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  student-app-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-app-3
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/student_results
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Shankii9900#
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_DATA_REDIS_PORT: 6379
    networks:
      - student-result-network
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis-cache:
    image: redis:latest
    container_name: redis-cache
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - student-result-network
    restart: unless-stopped

networks:
  student-result-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
